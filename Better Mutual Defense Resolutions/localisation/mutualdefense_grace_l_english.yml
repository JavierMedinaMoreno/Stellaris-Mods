 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "The Readied Shield"
 resolution_mutualdefense_the_readied_shield_desc:0 "The universe is a dangerous place, and all members of the [GetCustomGalComOrImperium] should be ready to defend their worlds whether it be against pirates, space creatures, or the unknown."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "[GetCustomGalComOrImperium] members that are using less than §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! of their £empire_sprawl£ §YEmpire Size§! in£navy_size£§YNavy Size§! while at peace are in §RBreach of Galactic Law§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Is in Breach of Galactic Law if £navy_size£§YNavy Size§! is less than §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! of £empire_sprawl£ §YEmpire Size§! while at peace."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Military Readiness Act"
 resolution_mutualdefense_military_readiness_act_desc:0 "Each member of the [GetCustomGalComOrImperium] has a duty to themselves and to others to contribute to galactic defense."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "[GetCustomGalComOrImperium] members that are using less than §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! of their £empire_sprawl£ §YEmpire Size§! in£navy_size£§YNavy Size§! while at peace are in §RBreach of Galactic Law§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Is in Breach of Galactic Law if £navy_size£§YNavy Size§! is less than §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! of £empire_sprawl£ §YEmpire Size§! while at peace."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "The Enemy of My Enemy"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "An enemy of one is the enemy of all. If one of our number is attacked, should we not permit any of our number to punish the offender?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Grants the §Y'Counterattack'§! casus belli on empires that are not [GetCustomGalComOrImperium] members and are in an offensive war against a [GetCustomGalComOrImperium] member.\n\n[GetCustomGalComOrImperium] members that are using less than §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! of their £empire_sprawl£ §YEmpire Size§! in£navy_size£§YNavy Size§! while at peace are in §RBreach of Galactic Law§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Is in Breach of Galactic Law if £navy_size£§YNavy Size§! is less than §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! of £empire_sprawl£ §YEmpire Size§! while at peace."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Castigation Proclamation"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Those who are not with us are against us, and all who stand against Galactic Law must be punished."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Any Empire in the [GetCustomGalComOrImperium] can propose a resolution to §YDenounce§! an Empire in §RBreach of Galactic Law§! or that is not a [GetCustomGalComOrImperium] member.\n\nThe §Y'Animosity'§! casus belli and §Y'Humiliation'§! wargoal can be used by empires with §YUnrestricted Wars§! against empires that have been §RDenounced§! by the [GetCustomGalComOrImperium] or are in §RBreach of Galactic Law§!.\n\n[GetCustomGalComOrImperium] members that are using less than §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! of their £empire_sprawl£ §YEmpire Size§! in£navy_size£§YNavy Size§! while at peace are in §RBreach of Galactic Law§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Is in Breach of Galactic Law if £navy_size£§YNavy Size§! is less than §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! of £empire_sprawl£ §YEmpire Size§! while at peace."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Renegade Containment Doctrine"
 resolution_mutualdefense_renegade_containment_desc:0 "The benefits of membership in the [GetCustomGalComOrImperium] are self-evident, and as such refusal to be a member clearly indicates ill intent. Members should be authorized to preempt any nefarious acts with force before non-members enact their plots."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Grants the §Y'Preemptive War'§! total war casus belli on empires that are not members of the [GetCustomGalComOrImperium] for empires with §YUnrestricted Wars§!.\n\n[GetCustomGalComOrImperium] members that are using less than §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! of their £empire_sprawl£ §YEmpire Size§! in£navy_size£§YNavy Size§! while at peace are in §RBreach of Galactic Law§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Is in Breach of Galactic Law if £navy_size£§YNavy Size§! is less than §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! of £empire_sprawl£ §YEmpire Size§! while at peace."

