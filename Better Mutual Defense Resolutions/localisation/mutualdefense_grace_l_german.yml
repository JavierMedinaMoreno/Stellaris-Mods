 mutual_defense_grace_period:0 "Schonfrist für gegenseitige Verteidigung"
 mutual_defense_grace_period_desc:0 "Dieses Reich befindet sich derzeit in einer Schonfrist, um die Anforderungen der [GetCustomGalComOrImperium] an die £navy_size£§YFlottengröße§! zu erfüllen, bevor Strafen wegen Gesetzesbruchs verhängt werden."
 mutualdefense_grace.2.name:0 "Schonfrist für gegenseitige Verteidigung begonnen"
 mutualdefense_grace.2.desc:0 "Unsere£navy_size£§YFlottengröße§! liegt derzeit unter den Anforderungen der aktiven Resolution zur gegenseitigen Verteidigung der [GetCustomGalComOrImperium].\n\nUns wurde eine §Y$@GRACE_PERIOD_YEARS|0$-jährige Schonfrist§! gewährt, um unsere Flotte aufzubauen, bevor wir formell als im §RBruch des galaktischen Gesetzes§! befindlich erklärt werden."
 mutualdefense_grace.2.a:0 "Wir werden uns darum kümmern."
 mutualdefense_grace.3.name:0 "Verteidigungsverpflichtung erfüllt"
 mutualdefense_grace.3.desc:0 "Unsere Flottenstreitkräfte entsprechen nun den Standards für gegenseitige Verteidigung der [GetCustomGalComOrImperium]."
 mutualdefense_grace.3.a:0 "Ausgezeichnet."

