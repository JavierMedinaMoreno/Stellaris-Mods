 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "Das bereite Schild"
 resolution_mutualdefense_the_readied_shield_desc:0 "Das Universum ist ein gefährlicher Ort, und alle Mitglieder der [GetCustomGalComOrImperium] sollten bereit sein, ihre Welten zu verteidigen, sei es gegen Piraten, Weltraumkreaturen oder das Unbekannte."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Mitglieder der [GetCustomGalComOrImperium], die im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! ihrer £empire_sprawl£ §YReichsgröße§! in£navy_size£§YFlottengröße§! nutzen, begehen einen §RBruch des galaktischen Gesetzes§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Begeht einen Bruch des galaktischen Gesetzes, wenn die£navy_size£§YFlottengröße§! im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! der £empire_sprawl£ §YReichsgröße§! beträgt."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Militärisches Bereitschaftsgesetz"
 resolution_mutualdefense_military_readiness_act_desc:0 "Jedes Mitglied der [GetCustomGalComOrImperium] hat gegenüber sich selbst und anderen die Pflicht, zur galaktischen Verteidigung beizutragen."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Mitglieder der [GetCustomGalComOrImperium], die im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! ihrer £empire_sprawl£ §YReichsgröße§! in£navy_size£§YFlottengröße§! nutzen, begehen einen §RBruch des galaktischen Gesetzes§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Begeht einen Bruch des galaktischen Gesetzes, wenn die£navy_size£§YFlottengröße§! im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! der £empire_sprawl£ §YReichsgröße§! beträgt."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "Der Feind meines Feindes"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "Der Feind des einen ist der Feind von allen. Wenn eines unserer Mitglieder angegriffen wird, sollten wir dann nicht zulassen, dass ein anderes Mitglied den Täter bestraft?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Gewährt den Kriegsgrund §YGegenangriff§! gegen Reiche, die kein Mitglied der [GetCustomGalComOrImperium] sind und sich in einem offensiven Krieg gegen ein Mitglied der [GetCustomGalComOrImperium] befinden.\n\nMitglieder der [GetCustomGalComOrImperium], die im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! ihrer £empire_sprawl£ §YReichsgröße§! in£navy_size£§YFlottengröße§! nutzen, begehen einen §RBruch des galaktischen Gesetzes§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Begeht einen Bruch des galaktischen Gesetzes, wenn die£navy_size£§YFlottengröße§! im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! der £empire_sprawl£ §YReichsgröße§! beträgt."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Züchtigungsverkündung"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Diejenigen, die nicht für uns sind, sind gegen uns und alle, die sich gegen das galaktische Gesetz stellen, müssen bestraft werden."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Jedes Mitglied der [GetCustomGalComOrImperium] kann einen Beschluss vorschlagen, der ein Reich §YDenunziert§!, das als im §RBruch des galaktischen Gesetzes§! befindlich gilt oder kein Mitglied der [GetCustomGalComOrImperium] ist.\n\nDer Kriegsgrund §YErniedrigung§! und das Kriegsziel §YErniedrigung§! können von Reichen verwendet werden, die §Yunbeschränkte Kriege§! gegen Reiche führen können, welche von der [GetCustomGalComOrImperium] §RDenunziert§! wurden oder einen §RBruch des Galaktischen Gesetzes§! verübt haben.\n\nMitglieder der [GetCustomGalComOrImperium], die im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! ihrer £empire_sprawl£ §YReichsgröße§! in£navy_size£§YFlottengröße§! nutzen, begehen einen §RBruch des galaktischen Gesetzes§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Begeht einen Bruch des galaktischen Gesetzes, wenn die£navy_size£§YFlottengröße§! im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! der £empire_sprawl£ §YReichsgröße§! beträgt."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Eindämmungsdoktrin für Abtrünnige"
 resolution_mutualdefense_renegade_containment_desc:0 "Die Vorteile einer Mitgliedschaft in der [GetCustomGalComOrImperium] liegen auf der Hand, und die Weigerung, Mitglied zu werden, weist eindeutig auf schlechte Absichten hin. Die Mitglieder sollten ermächtigt werden, ruchlose Handlungen mit Gewalt zu verhindern, bevor Nichtmitglieder ihre Pläne in Gang setzen können."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Gewährt Reichen mit §Yunbeschränkten Kriegen§! den Kriegsgrund §YPräventivkrieg§! gegen Reiche, die nicht Teil der [GetCustomGalComOrImperium] sind.\n\nMitglieder der [GetCustomGalComOrImperium], die im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! ihrer £empire_sprawl£ §YReichsgröße§! in£navy_size£§YFlottengröße§! nutzen, begehen einen §RBruch des galaktischen Gesetzes§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Begeht einen Bruch des galaktischen Gesetzes, wenn die£navy_size£§YFlottengröße§! im Frieden weniger als §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! der £empire_sprawl£ §YReichsgröße§! beträgt."

