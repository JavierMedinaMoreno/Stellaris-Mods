 mutual_defense_grace_period:0 "共同防御宽限期"
 mutual_defense_grace_period_desc:0 "该帝国目前处于宽限期内，以在违规惩罚生效前满足[GetCustomGalComOrImperium]£navy_size£§Y舰队规模§!要求。"
 mutualdefense_grace.2.name:0 "共同防御宽限期开始"
 mutualdefense_grace.2.desc:0 "我们当前的£navy_size£§Y舰队规模§!低于生效中的[GetCustomGalComOrImperium]共同防御决议要求。\n\n我们获得了§Y$@GRACE_PERIOD_YEARS|0$年的宽限期§!来扩充舰队，随后才会被正式判定为§R违反星系法§!。"
 mutualdefense_grace.2.a:0 "我们会着手处理。"
 mutualdefense_grace.3.name:0 "防御承诺已达成"
 mutualdefense_grace.3.desc:0 "我们的海军力量现已符合[GetCustomGalComOrImperium]的共同防御标准。"
 mutualdefense_grace.3.a:0 "太好了。"

 mod_gal_community:0 "星海共同体"
 mod_gal_imperium:0 "星海帝国"
