 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "El escudo preparado"
 resolution_mutualdefense_the_readied_shield_desc:0 "El universo es un lugar peligroso y todos los miembros de la [GetCustomGalComOrImperium] deberían estar preparados para defender su mundo contra piratas, criaturas espaciales o lo desconocido."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Los miembros de la [GetCustomGalComOrImperium] que usen menos del §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! de su £empire_sprawl£ §YTamaño del imperio§! en£navy_size£§YTamaño de la armada§! mientras estén en paz §Rquebrantan la ley galáctica§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Quebranta la ley galáctica si el£navy_size£§YTamaño de la armada§! es inferior al §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! del £empire_sprawl£ §YTamaño del imperio§! mientras esté en paz."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Ley de preparación militar"
 resolution_mutualdefense_military_readiness_act_desc:0 "Cada miembro de la [GetCustomGalComOrImperium] tiene el deber, consigo mismo y con los demás, de contribuir a la defensa galáctica."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Los miembros de la [GetCustomGalComOrImperium] que usen menos del §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! de su £empire_sprawl£ §YTamaño del imperio§! en£navy_size£§YTamaño de la armada§! mientras estén en paz §Rquebrantan la ley galáctica§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Quebranta la ley galáctica si el£navy_size£§YTamaño de la armada§! es inferior al §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! del £empire_sprawl£ §YTamaño del imperio§! mientras esté en paz."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "El enemigo de mi enemigo"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "El enemigo de uno es el enemigo de todos. Si atacan a uno de los nuestros, ¿no deberíamos permitir que se castigue al autor?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Concede el casus belli §Y\"Contraataque\"§! a los imperios que no son miembros de la [GetCustomGalComOrImperium] y que están en guerra ofensiva contra un miembro de la [GetCustomGalComOrImperium].\n\nLos miembros de la [GetCustomGalComOrImperium] que usen menos del §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! de su £empire_sprawl£ §YTamaño del imperio§! en£navy_size£§YTamaño de la armada§! mientras estén en paz §Rquebrantan la ley galáctica§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Quebranta la ley galáctica si el£navy_size£§YTamaño de la armada§! es inferior al §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! del £empire_sprawl£ §YTamaño del imperio§! mientras esté en paz."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Proclamación de castigo"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Si no están con nosotros, están en nuestra contra. Hay que castigar a quienes se opongan a la ley galáctica."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Cualquier imperio de la [GetCustomGalComOrImperium] puede proponer una resolución para §Ydenunciar§! a un imperio que §Rquebrante la ley galáctica§! o que no sea miembro de la [GetCustomGalComOrImperium].\n\nLos imperios con §YGuerras sin restricción§! pueden usar el casus belli §Y\"Animosidad\"§! y el objetivo de guerra §Y\"Humillación\"§! contra los imperios §Rdenunciados§! por la [GetCustomGalComOrImperium] o que §Rquebranten la ley galáctica§!.\n\nLos miembros de la [GetCustomGalComOrImperium] que usen menos del §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! de su £empire_sprawl£ §YTamaño del imperio§! en£navy_size£§YTamaño de la armada§! mientras estén en paz §Rquebrantan la ley galáctica§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Quebranta la ley galáctica si el£navy_size£§YTamaño de la armada§! es inferior al §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! del £empire_sprawl£ §YTamaño del imperio§! mientras esté en paz."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Doctrina de contención de renegados"
 resolution_mutualdefense_renegade_containment_desc:0 "Las ventajas de pertenecer a la [GetCustomGalComOrImperium] son evidentes y, por eso, negarse a ser miembro indica claramente una mala intención. Los miembros deberían poder prevenir los actos nefastos por la fuerza antes de que los no miembros ejecuten sus planes."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Concede el casus belli de guerra total §Y\"Guerra preventiva\"§! contra los imperios que no son miembros de la [GetCustomGalComOrImperium] a los imperios con §YGuerras sin restricción§!.\n\nLos miembros de la [GetCustomGalComOrImperium] que usen menos del §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! de su £empire_sprawl£ §YTamaño del imperio§! en£navy_size£§YTamaño de la armada§! mientras estén en paz §Rquebrantan la ley galáctica§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Quebranta la ley galáctica si el£navy_size£§YTamaño de la armada§! es inferior al §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! del £empire_sprawl£ §YTamaño del imperio§! mientras esté en paz."

