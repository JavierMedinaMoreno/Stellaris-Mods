 mutual_defense_grace_period:0 "Período de gracia de Defensa Mutua"
 mutual_defense_grace_period_desc:0 "Este imperio se encuentra actualmente en un período de gracia para cumplir con los requisitos de la [GetCustomGalComOrImperium]£navy_size£§YTamaño de la armada§! antes de que se apliquen las sanciones por infracción."
 mutualdefense_grace.2.name:0 "Comienzo del período de gracia de Defensa Mutua"
 mutualdefense_grace.2.desc:0 "Nuestro£navy_size£§YTamaño de la armada§! está actualmente por debajo de lo exigido por la resolución de Defensa Mutua activa de la [GetCustomGalComOrImperium].\n\nSe nos ha concedido un §Yperíodo de gracia de $@GRACE_PERIOD_YEARS|0$ años§! para ampliar nuestra flota antes de ser declarados formalmente en §Rquebrantamiento de la ley galáctica§!."
 mutualdefense_grace.2.a:0 "Nos ocuparemos de ello."
 mutualdefense_grace.3.name:0 "Compromiso de defensa cumplido"
 mutualdefense_grace.3.desc:0 "Nuestras fuerzas navales cumplen ahora con los estándares de Defensa Mutua de la [GetCustomGalComOrImperium]."
 mutualdefense_grace.3.a:0 "Excelente."

