 mutualdefense_grace.2.name:0 "상호 방위 유예 기간 시작"
 mutualdefense_grace.2.desc:0 "우리의£navy_size£§Y해군 규모§!는 현재 활성화된 [GetCustomGalComOrImperium] 상호 방위 결의안의 요구 사항에 미치지 못합니다.\n\n공식적으로 §R은하법 위반§!으로 선언되기 전에 함대를 증강할 수 있는 §Y$@GRACE_PERIOD_YEARS|0$년의 유예 기간§!이 부여되었습니다."
 mutualdefense_grace.2.a:0 "이 문제를 해결하겠다."
 mutualdefense_grace.3.name:0 "방위 공약 이행"
 mutualdefense_grace.3.desc:0 "우리의 해군 전력이 이제 [GetCustomGalComOrImperium]의 상호 방위 기준을 충족합니다."
