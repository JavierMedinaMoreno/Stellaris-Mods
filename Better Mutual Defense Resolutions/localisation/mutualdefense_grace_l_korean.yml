 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "준비된 방패"
 resolution_mutualdefense_the_readied_shield_desc:0 "우주는 위험한 장소이며 [GetCustomGalComOrImperium]의 모든 회원국은 해적, 우주 생명체, 미지의 존재로부터 자신의 행성을 방어할 준비가 되어 있어야 합니다."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "평화 시에 자신의 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! 미만을£navy_size£§Y해군 규모§!로 사용하는 [GetCustomGalComOrImperium] 회원국은 §R은하법 위반§! 상태가 됩니다."
 resolution_mutualdefense_the_readied_shield_breach:0 "평화 시에£navy_size£§Y해군 규모§!가 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! 미만인 경우 은하법 위반 상태가 됩니다."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "군사 준비태세 조약"
 resolution_mutualdefense_military_readiness_act_desc:0 "[GetCustomGalComOrImperium]의 모든 회원국에겐 스스로와 다른 회원국을 위해 은하 방위에 기여할 의무가 있습니다."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "평화 시에 자신의 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! 미만을£navy_size£§Y해군 규모§!로 사용하는 [GetCustomGalComOrImperium] 회원국은 §R은하법 위반§! 상태가 됩니다."
 resolution_mutualdefense_military_readiness_act_breach:0 "평화 시에£navy_size£§Y해군 규모§!가 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! 미만인 경우 은하법 위반 상태가 됩니다."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "내 적의 적"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "누구 하나의 적은 모두의 적입니다. 우리 중 하나가 공격당했다면, 우리 중 누구라도 공격자를 처벌할 수 있게 허용해야 하지 않겠습니까?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "[GetCustomGalComOrImperium] 회원국이 아니면서 [GetCustomGalComOrImperium] 회원국에 공격 전쟁을 벌인 제국을 대상으로 §Y'반격'§! 전쟁 명분을 부여합니다.\n\n평화 시에 자신의 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! 미만을£navy_size£§Y해군 규모§!로 사용하는 [GetCustomGalComOrImperium] 회원국은 §R은하법 위반§! 상태가 됩니다."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "평화 시에£navy_size£§Y해군 규모§!가 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! 미만인 경우 은하법 위반 상태가 됩니다."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "징벌 선언"
 resolution_mutualdefense_castigation_proclamation_desc:0 "우리와 함께하지 않는 자는 우리에 반하는 자들이며, 은하법에 반하는 자들은 반드시 처벌되어야 합니다."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "[GetCustomGalComOrImperium]의 모든 제국이 §R은하법 위반§!을 저질렀거나 [GetCustomGalComOrImperium] 회원국이 아닌 제국을 §Y규탄§!할 수 있습니다.\n\n§Y무제한 전쟁§!을 채택한 제국은 [GetCustomGalComOrImperium]에 의해 §R규탄§!받았거나 §R은하법 위반§!을 저지른 제국들을 상대로 §Y'적대감'§! 전쟁 명분과 §Y'굴욕'§! 전쟁 목표를 사용할 수 있습니다.\n\n평화 시에 자신의 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! 미만을£navy_size£§Y해군 규모§!로 사용하는 [GetCustomGalComOrImperium] 회원국은 §R은하법 위반§! 상태가 됩니다."
 resolution_mutualdefense_castigation_proclamation_breach:0 "평화 시에£navy_size£§Y해군 규모§!가 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! 미만인 경우 은하법 위반 상태가 됩니다."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "변절자 방지 원칙"
 resolution_mutualdefense_renegade_containment_desc:0 "[GetCustomGalComOrImperium]의 회원국이 되어 얻을 수 있는 혜택은 자명하므로 회원국이 되기를 거부하는 자들은 사악한 의도를 가지고 있는 것이 분명합니다. 비회원국이 음모를 꾸미기 전에 무력을 사용해 이런 사악한 행위를 방지할 수 있는 권한을 회원국에게 부여해야 합니다."
 resolution_mutualdefense_renegade_containment_tooltip:0 "§Y무제한 전쟁§!을 채택한 제국에게 [GetCustomGalComOrImperium] 회원국이 아닌 제국들을 상대로 §Y'선제공격'§! 총력전 전쟁 명분을 부여합니다.\n\n평화 시에 자신의 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! 미만을£navy_size£§Y해군 규모§!로 사용하는 [GetCustomGalComOrImperium] 회원국은 §R은하법 위반§! 상태가 됩니다."
 resolution_mutualdefense_renegade_containment_breach:0 "평화 시에£navy_size£§Y해군 규모§!가 £empire_sprawl£ §Y제국 크기§!의 §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! 미만인 경우 은하법 위반 상태가 됩니다."

