 mutual_defense_grace_period:0 "Льготный период взаимной обороны"
 mutual_defense_grace_period_desc:0 "Это государство находится в льготном периоде для выполнения требований [GetCustomGalComOrImperium] к £navy_size£§YРазмеру флота§! до применения штрафов за нарушение."
 mutualdefense_grace.2.name:0 "Начался льготный период взаимной обороны"
 mutualdefense_grace.2.desc:0 "Наш£navy_size£§YРазмер флота§! в настоящее время ниже требований действующей резолюции о взаимной обороне [GetCustomGalComOrImperium].\n\nНам предоставлен §Yльготный период сроком на $@GRACE_PERIOD_YEARS|0$ г.§!, чтобы нарастить флот, прежде чем мы будем официально объявлены §Rнарушителями галактического закона§!."
 mutualdefense_grace.2.a:0 "Мы займемся этим."
 mutualdefense_grace.3.name:0 "Оборонные обязательства выполнены"
 mutualdefense_grace.3.desc:0 "Наши военно-морские силы теперь соответствуют стандартам взаимной обороны [GetCustomGalComOrImperium]."
 mutualdefense_grace.3.a:0 "Превосходно."

 mod_gal_community:0 "Галактическое сообщество"
 mod_gal_imperium:0 "Галактический империум"
 gal_com_md_fleets_do_not_meet_requirement:0 "Их флоты не полностью соответствуют требованию"
 
 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "Щит наизготовку"
 resolution_mutualdefense_the_readied_shield_desc:0 "Вселенная — опасное место, и все государства, входящие в [GetCustomGalComOrImperium], должны быть готовы защищать свои миры от пиратов, космических созданий или неизвестных угроз."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Государства, входящие в [GetCustomGalComOrImperium], использующие в мирное время менее §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! своего £empire_sprawl£ §YРазмера государства§! в виде£navy_size£§YРазмера флота§!, §Rнарушают галактический закон§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Нарушает галактический закон, если£navy_size£§YРазмер флота§! в мирное время составляет менее §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! от £empire_sprawl£ §YРазмера государства§!."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Акт о военной готовности"
 resolution_mutualdefense_military_readiness_act_desc:0 "У всех государств, входящих в [GetCustomGalComOrImperium], есть долг перед собой и перед остальными, предписывающий вносить свой вклад в оборону галактики."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Государства, входящие в [GetCustomGalComOrImperium], использующие в мирное время менее §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! своего £empire_sprawl£ §YРазмера государства§! в виде£navy_size£§YРазмера флота§!, §Rнарушают галактический закон§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Нарушает галактический закон, если£navy_size£§YРазмер флота§! в мирное время составляет менее §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! от £empire_sprawl£ §YРазмера государства§!."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "Враг моего врага"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "Враг одного — враг всех. Если один из членов сообщества атакован, неужели мы не позволим всем желающим покарать напавшего?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Дает повод к войне §Y«Контратака»§! против государств, не входящих в [GetCustomGalComOrImperium] и ведущих наступательную войну против государства-члена.\n\nГосударства, входящие в [GetCustomGalComOrImperium], использующие в мирное время менее §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! своего £empire_sprawl£ §YРазмера государства§! в виде£navy_size£§YРазмера флота§!, §Rнарушают галактический закон§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Нарушает галактический закон, если£navy_size£§YРазмер флота§! в мирное время составляет менее §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! от £empire_sprawl£ §YРазмера государства§!."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Объявление выговора"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Кто не с нами, тот против нас. Все выступающие против галактического закона должны быть наказаны."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Любое государство, входящее в [GetCustomGalComOrImperium], может предложить резолюцию, §Yосуждающую§! государство, §Rнарушающее галактический закон§! или не входящее в [GetCustomGalComOrImperium].\n\nГосударства с политикой §Yнеограниченных войн§! могут использовать поводы к войне §Y«Враждебность»§! и §Y«Унижение»§! против тех государств, которые либо §Rнарушают галактический закон§!, либо их §Rосуждает§! [GetCustomGalComOrImperium].\n\nГосударства, входящие в [GetCustomGalComOrImperium], использующие в мирное время менее §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! своего £empire_sprawl£ §YРазмера государства§! в виде£navy_size£§YРазмера флота§!, §Rнарушают галактический закон§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Нарушает галактический закон, если£navy_size£§YРазмер флота§! в мирное время составляет менее §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! от £empire_sprawl£ §YРазмера государства§!."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Доктрина о сдерживании ренегатов"
 resolution_mutualdefense_renegade_containment_desc:0 "Выгода от вхождения в [GetCustomGalComOrImperium] очевидна, а потому отказ от участия явно свидетельствует о дурных намерениях. Государствам-участникам нужно позволить силой предотвращать любые гнусности до того, как внешние силы смогут осуществить свои намерения."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Дает государствам с политикой §Yнеограниченных войн§! повод к тотальной войне §Y«Превентивная война»§! против государств, не входящих в [GetCustomGalComOrImperium].\n\nГосударства, входящие в [GetCustomGalComOrImperium], использующие в мирное время менее §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! своего £empire_sprawl£ §YРазмера государства§! в виде£navy_size£§YРазмера флота§!, §Rнарушают галактический закон§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Нарушает галактический закон, если£navy_size£§YРазмер флота§! в мирное время составляет менее §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! от £empire_sprawl£ §YРазмера государства§!."

