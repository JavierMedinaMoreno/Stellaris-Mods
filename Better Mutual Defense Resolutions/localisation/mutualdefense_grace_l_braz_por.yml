 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "O Escudo Pronto"
 resolution_mutualdefense_the_readied_shield_desc:0 "O universo é um local perigoso, e todos os membros da [GetCustomGalComOrImperium] devem estar prontos para defender seus mundos, seja contra piratas, criaturas espaciais ou o desconhecido."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Membros da [GetCustomGalComOrImperium] que estejam usando menos de §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! do seu £empire_sprawl£ §YTamanho do Império§! em£navy_size£§YTamanho da Marinha§! enquanto em paz estão em §RInfração de Lei Galáctica§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Está em Infração de Lei Galáctica se o£navy_size£§YTamanho da Marinha§! for inferior a §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! do £empire_sprawl£ §YTamanho do Império§! enquanto em paz."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Ato de Prontidão Militar"
 resolution_mutualdefense_military_readiness_act_desc:0 "Cada membro da [GetCustomGalComOrImperium] possui um dever consigo mesmo e com outros para contribuir com a defesa galáctica."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Membros da [GetCustomGalComOrImperium] que estejam usando menos de §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! do seu £empire_sprawl£ §YTamanho do Império§! em£navy_size£§YTamanho da Marinha§! enquanto em paz estão em §RInfração de Lei Galáctica§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Está em Infração de Lei Galáctica se o£navy_size£§YTamanho da Marinha§! for inferior a §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! do £empire_sprawl£ §YTamanho do Império§! enquanto em paz."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "O Inimigo do Meu Inimigo"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "O inimigo de um é o inimigo de todos. Se um de nossos é atacado, não devemos permitir que nenhum outro puna o atacante?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Concede o casus belli §Y'Contra-ataque'§! em impérios que não são membros da [GetCustomGalComOrImperium] e estão em uma guerra ofensiva contra um membro da [GetCustomGalComOrImperium].\n\nMembros da [GetCustomGalComOrImperium] que estejam usando menos de §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! do seu £empire_sprawl£ §YTamanho do Império§! em£navy_size£§YTamanho da Marinha§! enquanto em paz estão em §RInfração de Lei Galáctica§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Está em Infração de Lei Galáctica se o£navy_size£§YTamanho da Marinha§! for inferior a §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! do £empire_sprawl£ §YTamanho do Império§! enquanto em paz."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Proclamação de Punição"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Aqueles que não estão conosco estão contra nós, e todos que estão contra a Lei Galáctica devem ser punidos."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Qualquer Império da [GetCustomGalComOrImperium] pode propor uma resolução para §YDenunciar§! um Império em §RInfração de Lei Galáctica§! ou que não seja membro da [GetCustomGalComOrImperium].\n\nO casus belli §Y'Animosidade'§! e objetivo de guerra §Y'Humilhação'§! podem ser usados por impérios com §YGuerras Irrestritas§! contra impérios que foram §RDenunciados§! pela [GetCustomGalComOrImperium] ou estão em §RInfração de Lei Galáctica§!.\n\nMembros da [GetCustomGalComOrImperium] que estejam usando menos de §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! do seu £empire_sprawl£ §YTamanho do Império§! em£navy_size£§YTamanho da Marinha§! enquanto em paz estão em §RInfração de Lei Galáctica§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Está em Infração de Lei Galáctica se o£navy_size£§YTamanho da Marinha§! for inferior a §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! do £empire_sprawl£ §YTamanho do Império§! enquanto em paz."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Doutrina de Contenção Renegada"
 resolution_mutualdefense_renegade_containment_desc:0 "Os benefícios da membresia na [GetCustomGalComOrImperium] são evidentes por si só, e como tal, a recusa em ser membro claramente indica más intenções. Membros devem ser autorizados a preverem quaisquer atos nefários com força antes de não-membros executarem suas tramoias."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Concede o casus belli guerra total §Y'Guerra Preventiva'§! contra todos os impérios que não são membros da [GetCustomGalComOrImperium] para impérios com §YGuerras Irrestritas§!.\n\nMembros da [GetCustomGalComOrImperium] que estejam usando menos de §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! do seu £empire_sprawl£ §YTamanho do Império§! em£navy_size£§YTamanho da Marinha§! enquanto em paz estão em §RInfração de Lei Galáctica§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Está em Infração de Lei Galáctica se o£navy_size£§YTamanho da Marinha§! for inferior a §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! do £empire_sprawl£ §YTamanho do Império§! enquanto em paz."

