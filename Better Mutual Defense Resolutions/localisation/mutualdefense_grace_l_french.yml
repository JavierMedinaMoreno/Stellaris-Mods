 mutual_defense_grace_period:0 "Période de grâce de défense mutuelle"
 mutual_defense_grace_period_desc:0 "Cet empire est actuellement en période de grâce pour atteindre les exigences de la [GetCustomGalComOrImperium]£navy_size£§YTaille de la flotte§! avant que les pénalités d'infraction ne s'appliquent."
 mutualdefense_grace.2.name:0 "Début de la période de grâce de défense mutuelle"
 mutualdefense_grace.2.desc:0 "Notre£navy_size£§YTaille de la flotte§! est actuellement inférieure aux exigences de la résolution de défense mutuelle active de la [GetCustomGalComOrImperium].\n\nUne §Ypériode de grâce de $@GRACE_PERIOD_YEARS|0$ ans§! nous a été accordée pour renforcer notre flotte avant d'être formellement déclarés en §Rinfraction avec les lois galactiques§!."
 mutualdefense_grace.2.a:0 "Nous allons nous en occuper."
 mutualdefense_grace.3.name:0 "Engagement de défense rempli"
 mutualdefense_grace.3.desc:0 "Nos forces navales sont désormais conformes aux normes de défense mutuelle de la [GetCustomGalComOrImperium]."
 mutualdefense_grace.3.a:0 "Excellent."

 mod_gal_community:0 "Communauté galactique"
 mod_gal_imperium:0 "Empire galactique"
 gal_com_md_fleets_do_not_meet_requirement:0 "Leurs flottes ne respectent pas pleinement les exigences"
 
 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "Bouclier toujours levé"
 resolution_mutualdefense_the_readied_shield_desc:0 "L'univers recèle de nombreux dangers, aussi tous les membres de la [GetCustomGalComOrImperium] doivent-ils se préparer à défendre leurs mondes, que ce soit contre les pirates, les créatures spatiales ou l'inconnu."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Tout membre de la [GetCustomGalComOrImperium] utilisant moins de §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en£navy_size£§YTaille de la flotte§! en temps de paix est en §Rinfraction avec les lois galactiques§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Est en infraction avec les lois galactiques si sa£navy_size£§YTaille de la flotte§! est inférieure à §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en temps de paix."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Loi de préparation militaire"
 resolution_mutualdefense_military_readiness_act_desc:0 "Chacun des membres de la [GetCustomGalComOrImperium] a le devoir, envers sa population et envers les autres, de contribuer à la défense de la galaxie."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Tout membre de la [GetCustomGalComOrImperium] utilisant moins de §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en£navy_size£§YTaille de la flotte§! en temps de paix est en §Rinfraction avec les lois galactiques§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Est en infraction avec les lois galactiques si sa£navy_size£§YTaille de la flotte§! est inférieure à §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en temps de paix."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "L'ennemi de nos ennemis"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "L'ennemi d'un membre de la Communauté galactique est l'ennemi de tous ses membres. Si l'un d'eux est attaqué, tous ne doivent-ils pas être autorisés à châtier l'agresseur ?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Offre le casus belli §Y$casus_belli_cb_counterattack$§! contre tout empire non membre de la [GetCustomGalComOrImperium] menant une guerre offensive contre un membre de la [GetCustomGalComOrImperium].\n\nTout membre de la [GetCustomGalComOrImperium] utilisant moins de §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en£navy_size£§YTaille de la flotte§! en temps de paix est en §Rinfraction avec les lois galactiques§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Est en infraction avec les lois galactiques si sa£navy_size£§YTaille de la flotte§! est inférieure à §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en temps de paix."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Proclamation des châtiments"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Ceux qui ne sont pas avec nous sont contre nous, et quiconque se dresse contre les lois galactiques doit être châtié."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Tout membre de la [GetCustomGalComOrImperium] peut proposer une résolution pour §Ydénoncer§! un empire §Renfreignant§! les lois galactiques ou qui n'est pas membre de la [GetCustomGalComOrImperium].\n\nLe casus belli §Y$casus_belli_cb_humiliation$§! et le but de guerre §Y$war_goal_wg_humiliation$§! pourront dès lors être utilisés par les empires ayant la politique de §Y$unrestricted_wars$§! contre les empires ainsi §Rdénoncés§! par la [GetCustomGalComOrImperium] ou qui §Renfreindraient§! les lois galactiques.\n\nTout membre de la [GetCustomGalComOrImperium] utilisant moins de §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en£navy_size£§YTaille de la flotte§! en temps de paix est en §Rinfraction avec les lois galactiques§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Est en infraction avec les lois galactiques si sa£navy_size£§YTaille de la flotte§! est inférieure à §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en temps de paix."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Doctrine d'endiguement des renégats"
 resolution_mutualdefense_renegade_containment_desc:0 "Les bénéfices de l'appartenance à la [GetCustomGalComOrImperium] parlent d'eux-mêmes. Tout refus d'y appartenir est donc la preuve d'une intention mauvaise. Les membres doivent par conséquent être autorisés à prévenir tout acte malfaisant par la force avant que les non-membres ne mettent en oeuvre leurs projets nuisibles."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Offre à tout membre de la [GetCustomGalComOrImperium] ayant la politique de §Y$unrestricted_wars$§! le casus belli §Y$war_goal_wg_renegade_containment$§! contre tout empire n'étant pas membre de la [GetCustomGalComOrImperium].\n\nTout membre de la [GetCustomGalComOrImperium] utilisant moins de §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en£navy_size£§YTaille de la flotte§! en temps de paix est en §Rinfraction avec les lois galactiques§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Est en infraction avec les lois galactiques si sa£navy_size£§YTaille de la flotte§! est inférieure à §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! de son £empire_sprawl£ §YExtension de l'empire§! en temps de paix."

