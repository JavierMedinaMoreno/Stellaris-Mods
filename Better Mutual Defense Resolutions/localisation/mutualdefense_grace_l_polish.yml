 mutual_defense_grace_period:0 "Okres karencji wzajemnej obrony"
 mutual_defense_grace_period_desc:0 "To imperium znajduje się obecnie w okresie karencji na spełnienie wymogów [GetCustomGalComOrImperium] dotyczących £navy_size£§YRozmiaru floty§!, zanim zostaną nałożone kary za naruszenie prawa."
 mutualdefense_grace.2.name:0 "Rozpoczął się okres karencji wzajemnej obrony"
 mutualdefense_grace.2.desc:0 "Nasz£navy_size£§YRozmiar floty§! jest obecnie poniżej wymogów aktywnej uchwały o wzajemnej obronie [GetCustomGalComOrImperium].\n\nOtrzymaliśmy §Yokres karencji wynoszący $@GRACE_PERIOD_YEARS|0$ lat§!, aby rozbudować naszą flotę przed formalnym uznaniem nas za §Rłamiących prawo galaktyczne§!."
 mutualdefense_grace.2.a:0 "Zajmiemy się tym."
 mutualdefense_grace.3.name:0 "Zobowiązanie obronne spełnione"
 mutualdefense_grace.3.desc:0 "Nasze siły marynarki wojennej spełniają już standardy wzajemnej obrony [GetCustomGalComOrImperium]."
 mutualdefense_grace.3.a:0 "Znakomicie."

 mod_gal_community:0 "Wspólnota Galaktyczna"
 mod_gal_imperium:0 "Imperium Galaktyczne"
 gal_com_md_fleets_do_not_meet_requirement:0 "Ich floty nie spełniają w pełni wymogów"
 
 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "Tarcza w pogotowiu"
 resolution_mutualdefense_the_readied_shield_desc:0 "Wszechświat jest niebezpiecznym miejscem i wszyscy członkowie [GetCustomGalComOrImperium] powinni być gotowi do obrony swoich światów, nieważne, czy przed piratami, kosmicznymi potworami, czy nieznanym."
 resolution_mutualdefense_the_readied_shield_tooltip:0 "Członkowie [GetCustomGalComOrImperium], którzy w czasie pokoju przeznaczają mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! swojej £empire_sprawl£ §YWielkości imperium§! na£navy_size£§YRozmiar floty§!, §Rłamią prawo galaktyczne§!."
 resolution_mutualdefense_the_readied_shield_breach:0 "Łamie prawo galaktyczne, jeśli£navy_size£§YRozmiar floty§! w czasie pokoju wynosi mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§! £empire_sprawl£ §YWielkości imperium§!."

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "Ustawa o gotowości militarnej"
 resolution_mutualdefense_military_readiness_act_desc:0 "Wszyscy członkowie [GetCustomGalComOrImperium] mają obowiązek - wobec siebie i innych - wspomagać obronę na poziomie galaktycznym."
 resolution_mutualdefense_military_readiness_act_tooltip:0 "Członkowie [GetCustomGalComOrImperium], którzy w czasie pokoju przeznaczają mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! swojej £empire_sprawl£ §YWielkości imperium§! na£navy_size£§YRozmiar floty§!, §Rłamią prawo galaktyczne§!."
 resolution_mutualdefense_military_readiness_act_breach:0 "Łamie prawo galaktyczne, jeśli£navy_size£§YRozmiar floty§! w czasie pokoju wynosi mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§! £empire_sprawl£ §YWielkości imperium§!."

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "Wróg mojego wroga"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "Wróg jednego z nas jest wrogiem nas wszystkich. Jeśli jedno z naszych imperiów zostanie zaatakowane, czy nie powinniśmy pozwolić wszystkim, by ukarali napastnika?"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "Daje casus belli \"§Ykontratak§!\" przeciwko imperiom, których nie zrzesza [GetCustomGalComOrImperium] i toczącym wojnę ofensywną przeciwko jednemu z członków [GetCustomGalComOrImperium].\n\nCzłonkowie [GetCustomGalComOrImperium], którzy w czasie pokoju przeznaczają mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! swojej £empire_sprawl£ §YWielkości imperium§! na£navy_size£§YRozmiar floty§!, §Rłamią prawo galaktyczne§!."
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "Łamie prawo galaktyczne, jeśli£navy_size£§YRozmiar floty§! w czasie pokoju wynosi mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§! £empire_sprawl£ §YWielkości imperium§!."

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "Proklamacja krytyki"
 resolution_mutualdefense_castigation_proclamation_desc:0 "Kto nie jest z nami, ten jest przeciw nam. A wszyscy, którzy sprzeciwiają się prawu galaktycznemu, muszą ponieść karę."
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "Każde imperium wchodzące w skład [GetCustomGalComOrImperium] może proponować uchwałę w celu §Ypotępienia§! innego imperium, które §Rłamie prawo galaktyczne§! lub nie jest członkiem [GetCustomGalComOrImperium].\n\nCasus belli \"§Yanimozja§!\" i cel wojny \"§Yupokorzenie§!\" mogą być stosowane przez imperia mające §Ynieograniczone wojny§! przeciwko imperiom, które §Rpotępia§! [GetCustomGalComOrImperium] lub §Rłamiącym prawo galaktyczne§!.\n\nCzłonkowie [GetCustomGalComOrImperium], którzy w czasie pokoju przeznaczają mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! swojej £empire_sprawl£ §YWielkości imperium§! na£navy_size£§YRozmiar floty§!, §Rłamią prawo galaktyczne§!."
 resolution_mutualdefense_castigation_proclamation_breach:0 "Łamie prawo galaktyczne, jeśli£navy_size£§YRozmiar floty§! w czasie pokoju wynosi mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§! £empire_sprawl£ §YWielkości imperium§!."

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "Doktryna zwalczania buntowników"
 resolution_mutualdefense_renegade_containment_desc:0 "[GetCustomGalComOrImperium] przynosi oczywiste korzyści, w związku z czym odmowa wstąpienia do tej organizacji wyraźnie wskazuje złe zamiary. Członkowie Wspólnoty powinni być upoważnieni do zapobiegania siłą wszelkim nieprzychylnym wystąpieniom, zanim imperia nienależące do niej zaczną realizować swe podstępne plany."
 resolution_mutualdefense_renegade_containment_tooltip:0 "Daje imperiom mającym §Ynieograniczone wojny§! casus belli wojny totalnej \"§Ywojna uprzedzająca§!\" przeciwko imperiom nienależącym do [GetCustomGalComOrImperium].\n\nCzłonkowie [GetCustomGalComOrImperium], którzy w czasie pokoju przeznaczają mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! swojej £empire_sprawl£ §YWielkości imperium§! na£navy_size£§YRozmiar floty§!, §Rłamią prawo galaktyczne§!."
 resolution_mutualdefense_renegade_containment_breach:0 "Łamie prawo galaktyczne, jeśli£navy_size£§YRozmiar floty§! w czasie pokoju wynosi mniej niż §Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§! £empire_sprawl£ §YWielkości imperium§!."

