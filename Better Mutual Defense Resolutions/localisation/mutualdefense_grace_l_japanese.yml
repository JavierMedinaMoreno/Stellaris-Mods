 mutual_defense_grace_period:0 "相互防衛の猶予期間"
 mutual_defense_grace_period_desc:0 "この帝国は違反ペナルティが適用される前に、[GetCustomGalComOrImperium]の£navy_size£§Y宇宙軍規模§!の要件を満たす猶予期間中です。"
 mutualdefense_grace.2.name:0 "相互防衛猶予期間の開始"
 mutualdefense_grace.2.desc:0 "我が国の£navy_size£§Y宇宙軍規模§!は現在、有効な[GetCustomGalComOrImperium]相互防衛決議の要件を下回っています。\n\n正式に§R銀河法違反§!と宣告される前に、艦隊を増強するための§Y$@GRACE_PERIOD_YEARS|0$年間の猶予期間§!が与えられました。"
 mutualdefense_grace.2.a:0 "これに対処しよう。"
 mutualdefense_grace.3.name:0 "防衛義務の達成"
 mutualdefense_grace.3.desc:0 "我が国の宇宙軍戦力は[GetCustomGalComOrImperium]の相互防衛基準を満たしました。"
 mutualdefense_grace.3.a:0 "素晴らしい。"

