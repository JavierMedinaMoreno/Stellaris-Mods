 # =========================================================================
 # Mutual Defense Resolutions
 # =========================================================================

 # Tier 1: The Readied Shield
 resolution_mutualdefense_the_readied_shield:0 "防衛の準備"
 resolution_mutualdefense_the_readied_shield_desc:0 "宇宙は危険に満ちている。 [GetCustomGalComOrImperium]のすべての加盟国は、 自らの惑星の防衛に備えておくべきだ。 海賊から、 宇宙生物から、 あるいはそれ以外の未知なるものから。"
 resolution_mutualdefense_the_readied_shield_tooltip:0 "[GetCustomGalComOrImperium]の加盟国で、平和時に自国の£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§!未満しか£navy_size£§Y宇宙軍規模§!を使用していない国は、§R銀河法違反§!となる。"
 resolution_mutualdefense_the_readied_shield_breach:0 "平和時に£navy_size£§Y宇宙軍規模§!が£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_1|%0$§!未満である場合、銀河法違反となる。"

 # Tier 2: Military Readiness Act
 resolution_mutualdefense_military_readiness_act:0 "軍事準備法"
 resolution_mutualdefense_military_readiness_act_desc:0 "[GetCustomGalComOrImperium]の各加盟国は自国と他国に対して、 銀河の防衛に貢献する義務を負う。"
 resolution_mutualdefense_military_readiness_act_tooltip:0 "[GetCustomGalComOrImperium]の加盟国で、平和時に自国の£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§!未満しか£navy_size£§Y宇宙軍規模§!を使用していない国は、§R銀河法違反§!となる。"
 resolution_mutualdefense_military_readiness_act_breach:0 "平和時に£navy_size£§Y宇宙軍規模§!が£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_2|%0$§!未満である場合、銀河法違反となる。"

 # Tier 3: The Enemy of My Enemy
 resolution_mutualdefense_enemy_of_my_enemy:0 "敵の敵"
 resolution_mutualdefense_enemy_of_my_enemy_desc:0 "誰かの敵は全員の敵。 いずれかの加盟国が攻撃を受けたとき、 我々がこの犯罪者を罰することを許可すべきではないか？"
 resolution_mutualdefense_enemy_of_my_enemy_tooltip:0 "[GetCustomGalComOrImperium]の加盟国に侵略戦争中の[GetCustomGalComOrImperium]の非加盟国に対して、 §Y「反撃」§!の開戦事由が使用可能になる。\n\n[GetCustomGalComOrImperium]の加盟国で、平和時に自国の£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§!未満しか£navy_size£§Y宇宙軍規模§!を使用していない国は、§R銀河法違反§!となる。"
 resolution_mutualdefense_enemy_of_my_enemy_breach:0 "平和時に£navy_size£§Y宇宙軍規模§!が£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_3|%0$§!未満である場合、銀河法違反となる。"

 # Tier 4: Castigation Proclamation
 resolution_mutualdefense_castigation_proclamation:0 "非難宣言"
 resolution_mutualdefense_castigation_proclamation_desc:0 "我々に賛成しない者は反逆者である。 そして銀河法に対する反逆者はすべて、 罰を受けなければならない。"
 resolution_mutualdefense_castigation_proclamation_tooltip:0 "[GetCustomGalComOrImperium]のいずれかの構成国が、 §R銀河法違反§!の国または[GetCustomGalComOrImperium]の非構成国に対する§Y非難§!決議を提出可能になる。\n\n§Y無制限戦争§!を採用している国は、 [GetCustomGalComOrImperium]に§R非難§!されている、 または§R銀河法違反§!である国に対して、 §Y「敵意」§!の開戦事由と§Y「屈辱」§!の戦争目的が使用可能になる。\n\n[GetCustomGalComOrImperium]の加盟国で、平和時に自国の£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§!未満しか£navy_size£§Y宇宙軍規模§!を使用していない国は、§R銀河法違反§!となる。"
 resolution_mutualdefense_castigation_proclamation_breach:0 "平和時に£navy_size£§Y宇宙軍規模§!が£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_4|%0$§!未満である場合、銀河法違反となる。"

 # Tier 5: Renegade Containment Doctrine
 resolution_mutualdefense_renegade_containment:0 "反抗分子封じ込めドクトリン"
 resolution_mutualdefense_renegade_containment_desc:0 "[GetCustomGalComOrImperium]の構成国となることの利点は自明であり、 加盟を拒むことは明らかに邪悪な意図をもっている証拠だ。 構成国は、 非構成国がその計画を実行に移す前に、 武力によって邪悪な計画を先制除去する権利をもつべきだ。"
 resolution_mutualdefense_renegade_containment_tooltip:0 "§Y無制限戦争§!を採用している国は、 [GetCustomGalComOrImperium]の非加盟国に対して§Y「予防戦争」§!の総力戦開戦事由を使用可能になる。\n\n[GetCustomGalComOrImperium]の加盟国で、平和時に自国の£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§!未満しか£navy_size£§Y宇宙軍規模§!を使用していない国は、§R銀河法違反§!となる。"
 resolution_mutualdefense_renegade_containment_breach:0 "平和時に£navy_size£§Y宇宙軍規模§!が£empire_sprawl£ §Y帝国規模§!の§Y$@MUTUALDEFENSE_RATIO_TIER_5|%0$§!未満である場合、銀河法違反となる。"

